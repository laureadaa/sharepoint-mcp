# Despliegue en Fly.io — servidor MCP SharePoint/OneDrive, siempre encendido.
app = "sharepoint-mcp-legaltax"
primary_region = "mad"   # Madrid

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false     # NO apagar por inactividad (siempre disponible)
  auto_start_machines = true
  min_machines_running = 1       # mantener 1 máquina viva siempre

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
