# Despliegue en Render (https://render.com) — el más simple para obtener una URL pública HTTPS.
# Sube este repo a GitHub, en Render elige "New > Blueprint" y apunta a este archivo.
services:
  - type: web
    name: sharepoint-onedrive-mcp
    runtime: docker
    plan: free           # gratis (se duerme por inactividad; se mantiene despierto con un pinger)
    healthCheckPath: /health
    envVars:
      - key: AUTH_MODE
        value: delegated
      - key: TENANT_ID
        value: organizations
      - key: CLIENT_ID
        value: 14d82eec-204b-4c2f-b7e8-296a70dab67e   # cliente público oficial de Graph CLI (no es secreto)
      - key: BLOCK_ONEDRIVE
        value: "true"     # bloquea el OneDrive personal; SharePoint libre
      - key: GRAPH_REFRESH_TOKEN
        sync: false        # secreto: se pega en el panel de Render
      - key: MCP_AUTH_TOKEN
        sync: false        # secreto: se pega en el panel de Render
